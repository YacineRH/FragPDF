<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FragPDF — Tous vos outils PDF, 100 % dans votre navigateur</title>
  <meta name="description" content="Éditez, signez, fusionnez, divisez, compressez, convertissez et protégez vos PDF. Gratuit, sans envoi de fichier : tout reste sur votre appareil." />
  <meta name="theme-color" content="#6d4aff" />
  <meta property="og:title" content="FragPDF — Tous vos outils PDF, 100 % dans votre navigateur" />
  <meta property="og:description" content="Éditer, signer, fusionner, compresser, convertir et protéger vos PDF — sans envoi de fichier." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('fragpdf.theme') || 'null');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>FragPDF nécessite JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
