name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Installer Chromium (version attendue par playwright-core)
        run: npx playwright-core install --with-deps chromium
      - name: Test de fumée (build de production)
        run: |
          export CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npm run test:smoke
      - name: Tests de bout en bout
        run: |
          export CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npm run test:e2e
